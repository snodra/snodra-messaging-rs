name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libsasl2-dev zlib1g-dev libzstd-dev

      - name: the tag must be the crate version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $MANIFEST" >&2
            exit 1
          fi

      # crates.io needs the core in the index before the add-ons can be published, so the add-ons
      # retry for a few minutes while it propagates.
      # Publishing is idempotent: a re-run skips what is already on the index, so a failure halfway
      # through never strands the remaining crates.
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          publish_crate() {
            crate="$1"
            if curl -fsS "https://crates.io/api/v1/crates/$crate/$VERSION" >/dev/null 2>&1; then
              echo "$crate $VERSION is already on crates.io"
              return 0
            fi
            for attempt in $(seq 1 20); do
              if cargo publish -p "$crate" --locked; then
                return 0
              fi
              sleep 15
            done
            echo "gave up publishing $crate" >&2
            return 1
          }
          for crate in snodra-messaging-rs snodra-messaging-kafka snodra-messaging-mongo snodra-messaging-sqlx snodra-messaging-rabbitmq; do
            publish_crate "$crate"
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REPOSITORY#*/} $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "crates.io: \`snodra-messaging-rs\`, \`-kafka\`, \`-mongo\`, \`-sqlx\`, \`-rabbitmq\` at \`$GITHUB_REF_NAME\`"
