name: release

# CI calls this after it pushes a release tag (ci.yml, job `release`): a tag pushed with
# GITHUB_TOKEN starts no workflow by itself. Run it by hand only to publish an existing tag again,
# for example to finish a release that failed halfway; nobody pushes tags.
#
# check (read-only): the tag, the crates' version, and the verifying build of the tagged tree.
# publish (read-only, the crates.io token): uploads the crates without building them again.
# github-release (write, no crates.io token): the GitHub release with the published packages.
# No job that holds a token able to publish or push compiles anything.
on:
  workflow_call:
    inputs:
      tag:
        description: The tag to release, for example v0.7.0
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to release again, for example v0.7.0
        required: true
        type: string

permissions:
  contents: read

# The input reaches the shells only through this variable, never written into a script.
env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Every other job needs this one: the tag must be a release version that already exists and the
  # crates in its tree must carry that version, so a mistyped tag publishes nothing and creates no
  # tag, and an old tag cannot publish crates under another version. It also builds the crates as
  # crates.io gets them, so the publish job can skip that build: when CI cut the tag this repeats
  # its packaging check, and a release run by hand never publishes an unbuilt tree.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      latest: ${{ steps.tag.outputs.latest }}
      crates: ${{ steps.crates.outputs.crates }}
    steps:
      - name: the tag is vN.N.N
        run: |
          if ! [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the tag input is not a release tag of the form vN.N.N"
            exit 1
          fi
      # The current scripts and every tag (the tag's own tree may predate scripts/).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tag exists, and whether it is the highest
        id: tag
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::error::the tag $TAG does not exist"
            exit 1
          fi
          highest=$(git tag --list 'v*' | scripts/last-tag.sh)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "latest=$([ "$TAG" = "$highest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$TAG; highest release tag: $highest"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          path: tagged
          persist-credentials: false
      # Read from the tagged tree with cargo itself, so the workspace inheritance is resolved. The
      # crates to publish and their order come from the same metadata (scripts/publish-order.sh).
      - name: every published crate of the tag has its version
        id: crates
        working-directory: tagged
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          rustup toolchain install --profile minimal --no-self-update
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          jq -r '.packages[] | select(.publish == null) | "\(.name) \(.version)"' "$RUNNER_TEMP/metadata.json"
          if ! jq -e --arg v "$VERSION" \
            '[.packages[] | select(.publish == null) | .version] | length > 0 and all(. == $v)' \
            "$RUNNER_TEMP/metadata.json" >/dev/null; then
            echo "::error::the crates at $TAG do not all have the version $VERSION"
            exit 1
          fi
          crates=$(../scripts/publish-order.sh < "$RUNNER_TEMP/metadata.json" | tr '\n' ' ')
          echo "publishing order: $crates"
          echo "crates=${crates% }" >> "$GITHUB_OUTPUT"
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libsasl2-dev zlib1g-dev libzstd-dev
      # Packages and builds every published crate of the tag, the add-ons against its core; no
      # token. A version already on crates.io is only a warning here.
      - name: the crates of the tag build as crates.io gets them
        working-directory: tagged
        run: cargo publish --workspace --dry-run --locked

  # In dependency order, core first. --no-verify: nothing is compiled while the crates.io token is
  # in the environment; the check job built this same tree.
  # crates.io needs the core in the index before an add-on can be published, so each crate retries
  # for a few minutes while it propagates.
  # Publishing is idempotent: crates.io is asked before every attempt, and a crate version already
  # there is skipped, so a re-run of a release that failed halfway publishes only what is missing.
  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          CRATES: ${{ needs.check.outputs.crates }}
        run: |
          rustup toolchain install --profile minimal --no-self-update
          log=$RUNNER_TEMP/publish.log
          published() {
            curl -fsS -A "snodra-release" "https://crates.io/api/v1/crates/$1/$VERSION" >/dev/null 2>&1
          }
          publish_crate() {
            crate=$1
            for attempt in $(seq 1 20); do
              if published "$crate"; then
                echo "$crate $VERSION is on crates.io"
                return 0
              fi
              if cargo publish -p "$crate" --locked --no-verify 2>&1 | tee "$log"; then
                return 0
              fi
              # The index knew the version before the API did: cargo's own line says so.
              if grep -Fqx "error: crate $crate@$VERSION already exists on crates.io index" "$log"; then
                echo "$crate $VERSION is on crates.io"
                return 0
              fi
              echo "attempt $attempt to publish $crate failed; retrying in 15 s"
              sleep 15
            done
            echo "::error::gave up publishing $crate $VERSION"
            return 1
          }
          [ -n "$CRATES" ] || { echo "::error::no crate to publish"; exit 1; }
          for crate in $CRATES; do
            [[ $crate =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::not a crate name"; exit 1; }
            publish_crate "$crate"
          done

  # After every crate is published, so a release that failed halfway is never shown as done (or as
  # the latest). It attaches the packages as crates.io serves them, so a re-run that skipped every
  # crate attaches them too. It builds nothing and has no crates.io token.
  github-release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: create the release, with the published packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ needs.check.outputs.latest }}
          VERSION: ${{ needs.check.outputs.version }}
          CRATES: ${{ needs.check.outputs.crates }}
        run: |
          names=$(printf '`%s`, ' $CRATES)
          NOTES="crates.io: ${names%, } at \`$TAG\`
          Packages: the published \`.crate\` files below."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REPOSITORY#*/} $TAG" --notes "$NOTES"
          else
            # --verify-tag: never create a tag here.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest="$LATEST" \
              --title "${GITHUB_REPOSITORY#*/} $TAG" --generate-notes --notes "$NOTES"
          fi
          dir=$RUNNER_TEMP/crates
          mkdir -p "$dir"
          for crate in $CRATES; do
            [[ $crate =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::not a crate name"; exit 1; }
            curl -fsSL --retry 10 --retry-delay 6 --retry-all-errors -A "snodra-release" \
              -o "$dir/$crate-$VERSION.crate" "https://static.crates.io/crates/$crate/$crate-$VERSION.crate"
          done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$dir"/*.crate
