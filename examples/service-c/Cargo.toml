[package]
name = "service-c"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Snodra example service C: handles Shout and Reverse, co-owns Inventory, the streaming Rows and the subscription WatchCounter, owns IncrementCounter, publishes text events, logs GreetingDelivered, prints every shout as a banner through a saga, runs the named event processor audit with a dead-letter admin API"
license = "MIT"
publish = false

[dependencies]
snodra-messaging-rs = { path = "../.." }
# The message store (ADR 0028): its own MongoDB database, through the MongoDB add-on.
snodra-messaging-mongo = { path = "../../crates/snodra-messaging-mongo" }
# The event store (ADR 0027): Kafka, through the Kafka add-on (also the printer's partner topic).
snodra-messaging-kafka = { path = "../../crates/snodra-messaging-kafka" }
mongodb = "3.9.1"
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The metrics export (ADR 0026): the OTLP meter provider the library's metrics go to when
# SNODRA_OTLP_ENDPOINT is set (the versions snodra-server and files-service use).
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "metrics"] }
serde_json = "1.0.154"
# The banner saga's edge (example-only, not the crate's): the printer webhook and GET /banners over
# HTTP (axum, already in the lock through tonic) and the printer client (the crate's reqwest).
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
# SagaTestFixture (feature `testing`) for the banner saga's unit tests.
snodra-messaging-rs = { path = "../..", features = ["testing"] }
