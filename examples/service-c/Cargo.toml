[package]
name = "service-c"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "kraken example service C: handles Shout and Reverse, co-owns Inventory, the streaming Rows and the subscription WatchCounter, owns IncrementCounter, publishes text events, logs GreetingDelivered"
license = "MIT"
publish = false

[dependencies]
kraken-messaging-rs = { path = "../.." }
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.154"
