[package]
name = "snodra-messaging-kafka"
version.workspace = true
edition = "2024"
rust-version = "1.99"
description = "Snodra messaging: the Kafka event store (publish, subscriptions, reset, lag, dead-letter topics, the event browser) and partner Kafka topics"
license = "Apache-2.0"
repository = "https://github.com/snodra/snodra-messaging-rs"
homepage = "https://snodra.damoreira.com/"
documentation = "https://docs.rs/snodra-messaging-kafka"
keywords = ["kafka","event-store","messaging","events"]
categories = ["database"]

[dependencies]
snodra-messaging = { workspace = true }
# librdkafka built from source (cmake), with zstd: records any Kafka client compressed (a Java
# client's compression.type=zstd too) can be read.
rdkafka = { version = "0.39.0", features = ["cmake-build", "zstd"] }
futures = "0.3"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
uuid = { version = "1", features = ["v4"] }

[features]
# TLS to Kafka (security.protocol SSL or SASL_SSL): librdkafka with a vendored OpenSSL, built from
# source and linked statically (no system OpenSSL at build or run time; a distroless image works).
ssl = ["rdkafka/ssl-vendored"]

[dev-dependencies]
snodra-messaging = { workspace = true, features = ["testing"] }
snodra-messaging-mongo = { path = "../snodra-messaging-mongo" }
mongodb = "3.9.1"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15.0", features = ["kafka", "mongo"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1.0.154"
