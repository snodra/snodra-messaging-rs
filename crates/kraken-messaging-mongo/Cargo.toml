[package]
name = "kraken-messaging-mongo"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "kraken messaging: the MongoDB message store (outbox, processed events, dead letters, processor control, external calls, sagas)"
license = "MIT"
publish = false

[dependencies]
kraken-messaging-rs = { path = "../.." }
mongodb = "3.9.1"
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
kraken-messaging-rs = { path = "../..", features = ["testing"] }
tokio = { version = "1.54.1", features = ["full"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15.0", features = ["mongo"] }
uuid = { version = "1", features = ["v4"] }
