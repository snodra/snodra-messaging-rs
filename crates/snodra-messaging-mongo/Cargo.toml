[package]
name = "snodra-messaging-mongo"
version.workspace = true
edition = "2024"
rust-version = "1.99"
description = "Snodra messaging: the MongoDB message store (outbox, processed events, dead letters, processor control, external calls, sagas)"
license = "Apache-2.0"
repository = "https://github.com/snodra/snodra-messaging-rs"
homepage = "https://snodra.damoreira.com/"
documentation = "https://docs.rs/snodra-messaging-mongo"
keywords = ["mongodb","outbox","messaging","events"]
categories = ["database"]

[dependencies]
snodra-messaging-rs = { workspace = true }
mongodb = "3.9.1"
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
snodra-messaging-rs = { workspace = true, features = ["testing"] }
tokio = { version = "1.54.1", features = ["full"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15.0", features = ["mongo"] }
uuid = { version = "1", features = ["v4"] }
