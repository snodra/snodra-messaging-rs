[package]
name = "kraken-messaging-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "kraken messaging client for Rust: hub client (commands, queries) and Kafka events"
license = "Apache-2.0"
publish = false

[lib]
name = "kraken_messaging"
path = "src/lib.rs"

[dependencies]
tonic = "0.14.8"
prost = "0.14.4"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5.3"
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
opentelemetry = "0.33.1"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
dashmap = "6"

[build-dependencies]
tonic-build = "0.14.8"
prost-build = "0.14.4"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
testcontainers = "0.28.0"
testcontainers-modules = { version = "0.15.0", features = ["kafka"] }
