[workspace]
members = [".", "examples/service-c"]
resolver = "3"

[package]
name = "kraken-messaging-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "kraken messaging client for Rust: hub client (commands, queries), Kafka events with a Mongo outbox, identity"
license = "MIT"
publish = false

[lib]
name = "kraken_messaging"
path = "src/lib.rs"

[dependencies]
# TLS: rustls with the ring provider (as the hub does) and the platform roots; no C toolchain.
tonic = { version = "0.14.8", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14.8"
prost = "0.14.4"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7.20"
futures = "0.3"
# librdkafka built from source (cmake); tokio support is built in since rdkafka 0.36.
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
mongodb = "3.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
base64 = "0.23"
# Client certificate (mTLS, P5c): the URI SAN, notAfter and public key of the leaf (pure Rust, as in
# the hub; no C toolchain), the SHA-256 fingerprint, and rustls' own key parsing to check the key
# belongs to the certificate.
x509-parser = { version = "0.18", default-features = false }
sha2 = "0.10.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
tracing = "0.1.44"
thiserror = "2"
# Metrics (ADR 0026): the library records through the OpenTelemetry API only; the application
# installs the meter provider (the SDK and an exporter). No provider: the API's no-op meter.
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }

[features]
# `saga::testing`: SagaTestFixture and the in-memory saga ports (S2-R6), for a service's own tests
# (`kraken-messaging-rs = { ..., features = ["testing"] }` under dev-dependencies).
testing = []

[build-dependencies]
tonic-prost-build = "0.14.8"
prost-build = "0.14.4"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6.5"
# Test certificates are generated at test time; nothing is checked in.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
time = "0.3" # validity periods of the test certificates
tokio-stream = { version = "0.1", features = ["net"] } # TcpListenerStream for the in-process fake hub
testcontainers = "0.27"
testcontainers-modules = { version = "0.15.0", features = ["kafka", "mongo"] }
# The in-memory metric exporter the metrics tests read back (as kraken-hub's).
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "testing"] }
